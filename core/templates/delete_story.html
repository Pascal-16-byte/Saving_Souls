{% extends 'base.html' %}
{% block title %}Delete Story{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="card p-4 shadow-sm">
        <h3>Are you sure you want to delete this story?</h3>
        <p>{{ story.content|truncatechars:200 }}</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Yes, Delete</button>
            <a href="{% url 'core:my_stories' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
