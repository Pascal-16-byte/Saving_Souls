{% extends 'base.html' %}
{% block title %}Edit Story{% endblock %}

{% block content %}
{% load static %}
<link rel="stylesheet" href="{% static 'core/css/edit_post.css' %}">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-lg p-4 border-0 rounded-4">
                <h2 class="text-center mb-4">Edit Your Story</h2>

                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="id_category" class="form-label fw-semibold">Category</label>
                        <div class="category-select">
                            {{ form.category }}
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="id_content" class="form-label fw-semibold">Content</label>
                        {{ form.content }}
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <button type="submit" class="btn btn-success px-4">Save Changes</button>
                        <a href="{% url 'core:my_stories' %}" class="btn btn-outline-secondary px-4">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
