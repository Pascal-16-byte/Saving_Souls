{% extends 'base.html' %}
{% load static %}
{% block title %}AI Support Chat{% endblock %}
{% block content %}
<link rel="stylesheet" href="{% static 'core/css/chatbot.css' %}">

<div class="chat-container d-flex justify-content-center align-items-center">
  <div class="card shadow-sm chat-card w-100" style="max-width: 520px;">
    <div class="card-header bg-primary text-white text-center fs-4 rounded-top">
      AI Supportive Chat 🤖💬
    </div>

    <div id="chat-box" class="card-body">
      <div id="messages"></div>
    </div>

    <div class="card-footer bg-white">
      <form id="chat-form" class="d-flex">
        <input
          type="text"
          id="user-input"
          class="form-control me-2"
          placeholder="Type something like ‘I’ve been feeling stressed lately...’"
          required
        />
        <button type="submit" class="btn btn-primary px-4">Send</button>
      </form>
    </div>
  </div>
</div>

<script src="{% static 'core/js/chatbot.js' %}"></script>
{% endblock %}
