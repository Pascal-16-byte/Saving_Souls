{% extends 'base.html' %}
{% block title %}Edit Story{% endblock %}

{% block content %}
<div class="container mt-5">
    <h2>Edit Your Story</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">Save Changes</button>
        <a href="{% url 'core:my_stories' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
